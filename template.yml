AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Cloud Guardian - Serverless IoT Security Monitor (Java)

Globals:
  Function:
    Timeout: 30
    Runtime: java17
    MemorySize: 512
    Architectures:
      - x86_64

Resources:

  CloudGuardianEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CloudGuardianEvents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: deviceId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: deviceId
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE

  IngestSensorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: CloudGuardian-IngestSensor
      CodeUri: target/Cloud-Guardian-1.0-SNAPSHOT.jar
      Handler: com.cloudguardian.handler.IngestSensorHandler::handleRequest
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref CloudGuardianEventsTable
      Environment:
        Variables:
          TABLE_NAME: !Ref CloudGuardianEventsTable
      Events:
        IngestApi:
          Type: Api
          Properties:
            Path: /sensor
            Method: post

  GetEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: CloudGuardian-GetEvents
      CodeUri: target/Cloud-Guardian-1.0-SNAPSHOT.jar
      Handler: com.cloudguardian.handler.GetEventsHandler::handleRequest
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref CloudGuardianEventsTable
      Environment:
        Variables:
          TABLE_NAME: !Ref CloudGuardianEventsTable
      Events:
        GetEventsApi:
          Type: Api
          Properties:
            Path: /events
            Method: get

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"