<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Guardian Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Cloud Guardian</h1>
            <p>IoT Security Monitoring Dashboard</p>
        </header>

        <section class="controls">
            <button onclick="loadEvents()">Refresh Events</button>
            <button onclick="simulateSensor()">Simulate Sensor Data</button>
        </section>

        <section id="status" class="status">
            Ready
        </section>

        <section class="events">
            <h2>Recent Events</h2>
            <div id="eventsList">
                <p>No events loaded yet.</p>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
